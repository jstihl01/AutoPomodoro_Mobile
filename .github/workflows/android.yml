name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      endurance:
        description: 'Ejecutar la prueba de reloj de 60 minutos'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPomodoro-debug
          path: app/build/outputs/apk/debug/*.apk
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.soakMinutes=${{ github.event_name == 'workflow_dispatch' && inputs.endurance && '60' || '0' }}
            mkdir -p device-screenshots
            adb pull /sdcard/Android/data/com.jstihl01.autopomodoro.mobile.debug/files/screenshots/. device-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-validation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-screenshots/
